name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # SchmidtDSE/glen-template's own Pages site redirects to its NRP deployment, which can
      # reach the MCP server's token (SchmidtDSE/geo-query#453); a static host
      # cannot. The condition keeps any repo made from this one publishing its
      # own app as before.
      - name: Build redirect site
        if: github.repository == 'SchmidtDSE/glen-template'
        run: |
          mkdir _site
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>Moved</title>
              <meta http-equiv="refresh" content="0; url=https://padus.nrp-nautilus.io/">
              <script>
                  location.replace('https://padus.nrp-nautilus.io' +
                      location.pathname.replace(/^\/glen-template/, '') + location.search + location.hash);
              </script>
          </head>
          <body><p>This site moved to <a href="https://padus.nrp-nautilus.io/">https://padus.nrp-nautilus.io</a>.</p></body>
          </html>
          EOF
          cp _site/index.html _site/404.html

      - name: Upload redirect
        if: github.repository == 'SchmidtDSE/glen-template'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload app
        if: github.repository != 'SchmidtDSE/glen-template'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
